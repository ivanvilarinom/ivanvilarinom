name: Languages card

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ivanvilarinom/languages-card@main
        with:
          token: ${{ secrets.LANGS_TOKEN }}
