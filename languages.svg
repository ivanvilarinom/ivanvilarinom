<svg xmlns="http://www.w3.org/2000/svg" width="854" height="160" viewBox="0 0 854 160">
  <!-- Lenguaje principal de 35 repos (públicos y privados), 2026-11-22. Estático: actualizar a mano. -->
  <style>
    .bg { fill: #f6f8fa; stroke: #d0d7de; }
    .h { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .s, .l { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .l b { fill: #1f2328; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .h, .l b { fill: #e6edf3; }
      .s, .l { fill: #8b949e; }
    }
  </style>
  <defs>
    <clipPath id="bar"><rect x="30" y="56" width="794" height="10" rx="5"/></clipPath>
  </defs>
  <rect class="bg" x=".5" y=".5" width="853" height="159" rx="10"/>
  <text class="h" x="30" y="36">Lenguajes</text>
  <text class="s" x="824" y="36" text-anchor="end">Lenguaje principal en 35 repositorios</text>
  <g clip-path="url(#bar)">
    <rect x="30" y="56" width="476.4" height="10" fill="#3572A5"/>
    <rect x="506.4" y="56" width="113.5" height="10" fill="#3178c6"/>
    <rect x="619.9" y="56" width="90.5" height="10" fill="#89e051"/>
    <rect x="710.4" y="56" width="45.3" height="10" fill="#e34c26"/>
    <rect x="755.7" y="56" width="23" height="10" fill="#41b883"/>
    <rect x="778.7" y="56" width="23" height="10" fill="#f34b7d"/>
    <rect x="801.7" y="56" width="22.3" height="10" fill="#384d54"/>
  </g>
  <g class="l">
    <circle cx="35" cy="101" r="5" fill="#3572A5"/><text x="47" y="105"><tspan font-weight="600" class="lb">Python</tspan> 60,0%</text>
    <circle cx="235" cy="101" r="5" fill="#3178c6"/><text x="247" y="105">TypeScript 14,3%</text>
    <circle cx="435" cy="101" r="5" fill="#89e051"/><text x="447" y="105">Shell 11,4%</text>
    <circle cx="635" cy="101" r="5" fill="#e34c26"/><text x="647" y="105">HTML 5,7%</text>
    <circle cx="35" cy="131" r="5" fill="#41b883"/><text x="47" y="135">Vue 2,9%</text>
    <circle cx="235" cy="131" r="5" fill="#f34b7d"/><text x="247" y="135">C++ 2,9%</text>
    <circle cx="435" cy="131" r="5" fill="#384d54"/><text x="447" y="135">Dockerfile 2,9%</text>
